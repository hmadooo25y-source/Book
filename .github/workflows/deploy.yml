name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files (PDF reader bundled for offline use)
        run: |
          mkdir -p www/pdfjs
          cp index.html manifest.webmanifest icon.svg icon-192.png icon-512.png www/
          npm init -y
          npm i pdfjs-dist@3.11.174
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/pdfjs/
          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/#pdfjs/#" www/index.html

      - name: Create Android project
        run: |
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Mulhim com.mulhim.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مُلهِم – نسخة ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
